<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
<style>
:root { color-scheme: light dark; }
.cat-dark { display: none; }
@media (prefers-color-scheme: dark) {
  .cat-light { display: none; }
  .cat-dark { display: block; }
}
</style>
<image class="cat-light" width="48" height="48" href="data:image/png;base64,"/>
<image class="cat-dark" width="48" height="48" href="data:image/png;base64,"/>
</svg>
