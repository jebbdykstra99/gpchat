name: rules-tests
on:
  pull_request:
    paths:
      - "preview-lift/**"
jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: preview-lift/rules-tests
      - run: npm run test:step1
        working-directory: preview-lift/rules-tests
      - run: npm run test:step3
        working-directory: preview-lift/rules-tests
      - run: npm run test:abuse
        working-directory: preview-lift/rules-tests
